services:
  - type: web
    name: gold-price-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BALE_TOKEN
        sync: false          # در پنل Render وارد می‌کنید
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET
        generateValue: true  # خودکار تولید می‌شه
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: products
      - key: GOOGLE_CREDS_JSON
        sync: false
      - key: BASE_URL
        sync: false          # مثلاً: https://gold-bot.onrender.com
      - key: ADMIN_IDS
        sync: false          # آی‌دی ادمین‌ها با کاما جدا کنید
